<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wedding RSVP</title>
  <style>
    body {
      font-family: 'Georgia', serif;
      background: #fff;
      margin: 0;
      padding: 0;
      background-image: url('floral.png'); /* Change to your image file name */
      background-size: cover;
      background-position: top right;
      background-repeat: no-repeat;
    }
    .container {
      max-width: 700px;
      margin: auto;
      padding: 50px 20px;
      background-color: rgba(255, 255, 255, 0.9);
      border-radius: 20px;
      text-align: center;
    }
    h1 {
      font-size: 60px;
      color: #6a7a34;
    }
    p {
      font-size: 18px;
      margin: 10px 0;
    }
    .italic {
      color: #6a7a34;
      font-style: italic;
      font-size: 20px;
    }
    input, textarea, button {
      width: 80%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      background-color: #6a7a34;
      color: white;
      border: none;
      font-size: 18px;
      cursor: pointer;
    }
    button:hover {
      background-color: #4e6120;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>RSVP</h1>
    <p>We have reserved <strong>____</strong> seat/s for you.</p>
    <p class="italic">We can’t wait to celebrate with you.</p>
    <p>a favor of your response is requested by <strong>July 20 of 2025</strong></p>

    <form action="https://formspree.io/f/your-form-id" method="POST">
      <input type="text" name="Name" placeholder="Your Full Name" required />
      <input type="email" name="Email" placeholder="Your Email" required />
      <textarea name="Message" rows="4" placeholder="Will you attend? Any notes?"></textarea>
      <button type="submit">Submit RSVP</button>
    </form>
  </div>
</body>
</html>
